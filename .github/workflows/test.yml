name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two setup steps because pip caching is GitHub-only: on the Forgejo runner
      # setup-python resolves cache-dependency-path against the action's own
      # directory instead of GITHUB_WORKSPACE, matches nothing, and fails the job:
      #   No file in /opt/mu-actions/actions-setup-python matched to
      #   [tests/requirements.txt or **/pyproject.toml]
      # Guarded with `if:` rather than a ternary on `cache:` — the same server_url
      # guard the other workflows use, and the only form proven on this runner.
      - uses: actions/setup-python@v5
        if: ${{ github.server_url == 'https://github.com' }}
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-python@v5
        if: ${{ github.server_url != 'https://github.com' }}
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
      - run: pytest -q tests
